<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
*,*::before,*::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: sticky flag-blue masthead, search + post row, category rail, then two columns (filters | listing rows with thumbnail on the right). Stacks to one column on phones. */
:root {
  --bg: #edf2f9;
  --surface: #ffffff;
  --surface-2: #f5f8fc;
  --ink: #0f2038;
  --muted: #5a6a82;
  --line: #d5dfeb;
  --brand: #2a6bc2;
  --brand-ink: #ffffff;
  --link: #1d5aa8;
  --chip: #e3edfa;
  --chip-ink: #174a8c;
  --cta: #f4b942;
  --cta-ink: #1c1604;
  --good: #1b7f5f;
  --thumb-s: 55%;
  --thumb-l1: 88%;
  --thumb-l2: 76%;
  --thumb-ic: 32%;
  --ic-s: 62%; --ic-l: 42%; --ct-l: 94%;
  --shadow: 0 1px 2px rgba(15,32,56,.06), 0 6px 20px rgba(15,32,56,.06);
  --font-display: "Familjen Grotesk", "Noto Sans Ethiopic", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", "Noto Sans Ethiopic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1626; --surface: #12233a; --surface-2: #0f1d31; --ink: #e5edf8; --muted: #93a5bf; --line: #223652;
    --brand: #123560; --brand-ink: #ffffff; --link: #7db3f5; --chip: #1b3558; --chip-ink: #a9cdf8;
    --cta: #f4b942; --cta-ink: #1c1604; --good: #4cc79d;
    --thumb-s: 38%; --thumb-l1: 24%; --thumb-l2: 34%; --thumb-ic: 74%; --ic-s: 70%; --ic-l: 70%; --ct-l: 21%;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1626; --surface: #12233a; --surface-2: #0f1d31; --ink: #e5edf8; --muted: #93a5bf; --line: #223652;
  --brand: #123560; --brand-ink: #ffffff; --link: #7db3f5; --chip: #1b3558; --chip-ink: #a9cdf8;
  --cta: #f4b942; --cta-ink: #1c1604; --good: #4cc79d;
  --thumb-s: 38%; --thumb-l1: 24%; --thumb-l2: 34%; --thumb-ic: 74%; --ic-s: 70%; --ic-l: 70%; --ct-l: 21%;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cta); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--brand-ink); }
.mast .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -.02em; line-height: 1; }
.logo svg { width: 22px; height: 22px; fill: #fff; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.14); border: 0; color: var(--brand-ink); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.pill:hover { background: rgba(255,255,255,.24); }
.pill svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.seg { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 10px; padding: 3px; }
.seg button { background: transparent; border: 0; color: var(--brand-ink); padding: 5px 10px; border-radius: 8px; font-weight: 600; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: #fff; color: #123560; }

/* Search row */
.tagline { margin: 22px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; letter-spacing: -.01em; text-wrap: balance; }
.find { display: flex; gap: 10px; padding-block: 12px 14px; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding-inline: 16px; gap: 10px; }
.search svg { width: 20px; height: 20px; stroke: var(--link); fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 15px 0; font-size: 1.05rem; outline: none; }
.search:focus-within { outline: 3px solid var(--cta); }
.search input::placeholder { color: var(--muted); }
.post { background: var(--cta); color: var(--cta-ink); border: 0; border-radius: 14px; padding: 0 22px; font-weight: 700; font-family: var(--font-display); font-size: 1.05rem; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.post:hover { filter: brightness(.96); }

/* Category rail */
.rail { display: flex; gap: 6px; overflow-x: auto; padding-block: 6px 12px; scrollbar-width: thin; }
.cat { flex: none; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 14px; padding: 10px 6px; color: var(--link); font-weight: 600; font-size: .9rem; }
.cat .ct { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: hsl(var(--h) 80% var(--ct-l)); font-style: normal; transition: transform .15s ease; }
.cat:hover .ct { transform: translateY(-2px); }
.cat svg { width: 30px; height: 30px; stroke: hsl(var(--h) var(--ic-s) var(--ic-l)); fill: hsl(var(--h) var(--ic-s) var(--ic-l) / .18); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.cat span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat:hover { background: var(--surface-2); }
.cat[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.cat[aria-pressed="true"] .ct { box-shadow: 0 0 0 3px var(--cta); }

/* Market */
.market { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; padding-block: 8px 40px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 18px; }
.group h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: .92rem; color: var(--ink); }
.tag:hover { border-color: var(--link); }
.tag[aria-pressed="true"] { background: var(--chip); border-color: var(--link); color: var(--chip-ink); }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.sel { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface); }
.sel svg { width: 18px; height: 18px; stroke: var(--link); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sel select { border: 0; background: transparent; padding: 10px 4px; font-weight: 600; color: var(--link); outline: none; min-width: 0; max-width: 160px; }
.sel select option { color: #0f2038; background: #fff; }
.chipbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600; color: var(--link); }
.chipbtn[aria-pressed="true"] { background: var(--chip); border-color: var(--link); color: var(--chip-ink); }
.count { margin-inline-start: auto; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

.list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 16px; background: var(--surface); border-radius: 16px; padding: 12px 12px 12px 18px; box-shadow: var(--shadow); }
.row.mine { outline: 2px solid var(--cta); }
.row .body { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-width: 0; padding-block: 4px; }
.row h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; color: var(--link); text-wrap: balance; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--chip); color: var(--chip-ink); display: inline-grid; place-items: center; font-size: .72rem; font-weight: 700; }
.price { margin-inline-start: auto; background: var(--chip); color: var(--chip-ink); font-weight: 700; border-radius: 999px; padding: 5px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.price.neg { background: transparent; color: var(--muted); font-weight: 500; }
.price { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.thumb { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(140deg, hsl(var(--h) var(--thumb-s) var(--thumb-l1)), hsl(calc(var(--h) + 18) var(--thumb-s) var(--thumb-l2))); color: hsl(var(--h) 50% var(--thumb-ic)); }
.thumb svg { width: 52%; height: 52%; stroke: currentColor; fill: currentColor; fill-opacity: .16; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border-radius: 16px; }
.morewrap { display: flex; justify-content: center; padding-top: 18px; }
.ghost { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 28px; font-weight: 700; color: var(--link); }
.ghost:hover { border-color: var(--link); }

/* Footer */
.foot { background: var(--surface-2); border-top: 1px solid var(--line); }
.apps { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding-block: 32px 8px; }
.appbtn { display: flex; flex-direction: row; align-items: center; gap: 10px; text-align: start; background: #0b0b0c; color: #fff; border: 1px solid #3a3a3d; border-radius: 10px; padding: 8px 18px 8px 16px; line-height: 1.1; min-width: 150px; }
.appbtn svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.appbtn span { display: flex; flex-direction: column; }
.appbtn small { font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.appbtn b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.langline { text-align: center; color: var(--muted); font-size: .9rem; padding-bottom: 22px; }
.strip { background: var(--cta); color: var(--cta-ink); border-radius: 16px; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.strip b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.strip span { font-weight: 500; }
.links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 32px; padding-block: 28px; }
.linkbtn { background: transparent; border: 0; padding: 8px 0; text-align: start; color: var(--link); font-weight: 600; }
.linkbtn { display: flex; align-items: center; gap: 12px; }
.linkbtn svg { width: 22px; height: 22px; flex: none; stroke: hsl(210 var(--ic-s) var(--ic-l)); fill: hsl(210 var(--ic-s) var(--ic-l) / .16); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.linkbtn:hover span { text-decoration: underline; }
.low { display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-block: 22px; }
.soc { display: flex; gap: 10px; flex-wrap: wrap; }
.soc button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); color: var(--link); font-weight: 700; font-family: var(--font-display); box-shadow: var(--shadow); }
.fs { display: flex; gap: 10px; }
.fs button { border: 1px solid var(--link); background: transparent; color: var(--link); border-radius: 12px; min-width: 52px; padding: 10px 14px; font-weight: 700; }
.legal { text-align: center; color: var(--muted); font-size: .85rem; padding-block: 6px 36px; }

/* Post dialog + toast */
.veil { position: fixed; inset: 0; z-index: 40; background: rgba(8,16,30,.6); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(480px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
.sheet h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 1.4rem; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-weight: 600; font-size: .9rem; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; font-weight: 500; }
.field textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; font-weight: 500; font-family: inherit; min-height: 84px; resize: vertical; }
.doc h3 { margin: 0 0 8px; }
.qa { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--surface-2); }
.qa summary { font-weight: 700; cursor: pointer; }
.qa p { margin: 8px 0 0; }
.vrow { display: flex; gap: 8px; margin-top: 6px; }
.vrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; }
.vrow .ghost { padding: 10px 14px; }
#pf-vmsg { font-weight: 600; min-height: 1.2em; }
#pf-vmsg.ok { color: #1b8a4b; }
.stars { display: flex; gap: 6px; margin: 8px 0 12px; }
.stars button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; font-size: 1.5rem; line-height: 1; padding: 8px 10px; color: var(--muted, #8a94a6); }
.stars button[aria-pressed="true"] { color: #f5a623; border-color: #f5a623; }
.radios { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.radios label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.acts { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; }
.acts .post { padding: 12px 22px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }


/* Language droplist, currency, chat, app tab bar */
.langsel { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.14); border-radius: 10px; padding: 0 6px 0 10px; color: var(--brand-ink); }
.langsel svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; flex: none; }
.langsel select { background: transparent; border: 0; color: inherit; font-weight: 600; padding: 9px 4px; outline: none; max-width: 130px; }
.langsel select option { color: #0f2038; background: #fff; }
.langsel:focus-within { outline: 3px solid var(--cta); }
.price small { display: block; font-weight: 500; font-size: .72rem; opacity: .8; text-align: end; }
.pricerow { display: flex; gap: 8px; }
.pricerow input { flex: 1; min-width: 0; }
.conv { color: var(--muted); font-weight: 500; min-height: 1.2em; font-variant-numeric: tabular-nums; }
.legal.rl { padding-block: 0 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chatfab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--cta); color: var(--cta-ink); box-shadow: var(--shadow); display: grid; place-items: center; }
.chatfab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.chat { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 32px)); height: min(540px, calc(100% - 150px)); z-index: 35; background: var(--surface); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; }
.chat header { background: var(--brand); color: var(--brand-ink); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-size: 1.05rem; }
.chat header button { background: none; border: 0; color: inherit; font-size: 1.6rem; line-height: 1; padding: 0 4px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface-2); align-self: flex-start; }
.msg.me { background: var(--brand); color: var(--brand-ink); align-self: flex-end; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px; }
.quick button { background: var(--chip); color: var(--chip-ink); border: 0; border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 600; }
.chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chat input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.chat .post { padding: 0 16px; border-radius: 12px; font-size: .95rem; }
.tabbar { display: none; }
@media (max-width: 720px) {
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--muted); padding: 4px 0; min-width: 0; }
  .tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabbar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar .mid i { width: 48px; height: 48px; border-radius: 50%; background: var(--cta); color: var(--cta-ink); display: grid; place-items: center; margin-top: -20px; box-shadow: var(--shadow); }
  .chatfab { display: none; }
  .chat { right: 8px; left: 8px; width: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); height: min(70vh, calc(100% - 110px)); }
  .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .find .post { display: none; }
}

/* Contact + owner actions */
a.post, a.ghost { text-decoration: none; display: inline-flex; align-items: center; }
a.post { padding: 12px 22px; }
a.ghost { padding: 12px 18px; color: var(--link); font-weight: 700; }
.btnrow .ghost { padding: 12px 18px; }
.btnrow .danger { color: #c0392b; border-color: #c0392b; }
/* Photos */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.photobtns { display: flex; gap: 8px; flex-wrap: wrap; }
.pbtn { cursor: pointer; padding: 10px 14px; border-radius: 12px; display: inline-flex; align-items: center; }
.pbtn:focus-within { outline: 3px solid var(--cta); outline-offset: 2px; }
.pthumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.pthumbs:empty { display: none; }
.pt { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.pt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pt button { position: absolute; top: 4px; inset-inline-end: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(8,16,30,.72); color: #fff; font-size: 1rem; line-height: 1; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
.thumb.photo { overflow: hidden; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-block: 16px; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; display: block; background: var(--surface-2); }
/* Detail + info pages */
.tlink { background: none; border: 0; padding: 0; text-align: start; color: inherit; font: inherit; cursor: pointer; }
.tlink:hover { text-decoration: underline; }
.row { cursor: pointer; }
.back { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 0; box-shadow: var(--shadow); color: var(--link); margin-block: 20px 12px; }
.back svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.crumbs { color: var(--muted); font-size: .88rem; margin-bottom: 12px; overflow-wrap: anywhere; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; padding-bottom: 44px; align-items: start; }
.panel { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; min-width: 0; }
.panel h1 { margin: 0 0 12px; font-family: var(--font-display); font-size: 1.8rem; line-height: 1.18; color: var(--link); text-wrap: balance; overflow-wrap: anywhere; }
.panel h2 { margin: 26px 0 8px; font-family: var(--font-display); font-size: 1.2rem; }
.panel p { margin: 0 0 10px; max-width: 68ch; }
.panel ul, .panel ol { margin: 0 0 10px; padding-inline-start: 22px; max-width: 68ch; display: flex; flex-direction: column; gap: 6px; }
.lead { color: var(--muted); font-size: 1.08rem; }
.big { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 14px; margin-block: 16px; }
.big svg { width: 26%; height: 26%; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 22px; margin: 16px 0; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-block: 14px; }
.tip { background: var(--chip); color: var(--chip-ink); border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-top: 14px; }
.tip button { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; }
.sim { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sim button { background: var(--surface-2); border: 0; border-radius: 12px; padding: 8px; text-align: start; font-weight: 600; font-size: .85rem; color: var(--ink); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sim .thumb { width: 100%; }
.sim span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.doc { max-width: 860px; margin-inline: auto; }
.pchips { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 14px; }
.pchips span { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-weight: 600; }
.pchips i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.loginbox { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--chip); color: var(--chip-ink); border-radius: 14px; padding: 12px 16px; font-weight: 600; max-width: 520px; }
.loginbox button { background: var(--surface); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 700; color: var(--link); }
.phone { color: var(--link); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; text-decoration: none; }
.phone:hover { text-decoration: underline; }
.eg { color: var(--muted); font-size: .88rem; margin-top: 18px; }

@media (max-width: 860px) {
  .dgrid { grid-template-columns: minmax(0, 1fr); }
  .panel h1 { font-size: 1.5rem; }
  .market { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .side { flex-direction: row; overflow-x: auto; gap: 18px; padding-bottom: 4px; }
  .group { flex: none; }
  .tags { flex-wrap: nowrap; }
  .tag { white-space: nowrap; }
  .links { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr) 92px; gap: 12px; padding-left: 14px; }

  .post .lbl { display: none; }
  .post { padding: 0 18px; }
  .logo { font-size: 1.45rem; }
  .cat { width: 80px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row { transition: transform .15s ease; }
  .row:hover { transform: translateY(-1px); }

    safety: {
      title: ['Xarunta Badbaadada', 'Safety Center', 'Kituo cha Usalama', 'የደህንነት ማዕከል', 'Centre de sécurité'],
      lead: ['Xaraash waxay rabtaa in dadku si ammaan ah u iibsadaan oo u iibiyaan. Halkan ka baro sida aad u ilaalin lahayd naftaada iyo lacagtaada.', 'Xaraash is built for people who want to buy and sell safely. Here is how to protect yourself and your money.', 'Xaraash imejengwa kwa watu wanaotaka kununua na kuuza kwa usalama. Hivi ndivyo unavyoweza kujilinda wewe na pesa zako.', 'Xaraash ሰዎች በደህንነት እንዲገዙና እንዲሸጡ የተሰራ ነው። እራስዎን እና ገንዘብዎን እንዴት እንደሚጠብቁ እነሆ።', 'Xaraash est conçu pour acheter et vendre en toute sécurité. Voici comment vous protéger, vous et votre argent.'],
      blocks: [
        { h: ['Ka ilaali khayaano', 'Protection from fraud', 'Jilinde dhidi ya ulaghai', 'ከማጭበርበር መከላከል', 'Protection contre la fraude'], ul: [
          ['Ha bixin lacag ka hor intaadan alaabta arkin oo hubin.', 'Do not pay before you have seen and checked the item.', 'Usilipe kabla ya kuona na kukagua bidhaa.', 'እቃውን ሳያዩና ሳይፈትሹ አይክፈሉ።', 'Ne payez pas avant d’avoir vu et vérifié l’article.'],
          ['Ku kulan goob dadweyne oo nabdoon, maalinta.', 'Meet in a safe public place, in daylight.', 'Kutana mahali salama pa watu wengi, mchana.', 'በቀን ብርሃን ደህንነቱ በተጠበቀ የሕዝብ ቦታ ይገናኙ።', 'Rencontrez-vous dans un lieu public sûr, en plein jour.'],
          ['Ha la wadaagin cidna koodhka xaqiijinta ama erayga sirta ah.', 'Never share a verification code or password with anyone.', 'Usimpe mtu yeyote msimbo wa uthibitisho au nenosiri.', 'የማረጋገጫ ኮድ ወይም የይለፍ ቃል ለማንም አያጋሩ።', 'Ne partagez jamais un code de vérification ou un mot de passe.'],
          ['Marka aydan kulmi karin, isticmaal Adeegga Iibsiga Aaminka ah.', 'When you cannot meet, use the Trusted Purchase Service.', 'Usipoweza kukutana, tumia Huduma ya Ununuzi Unaoaminika.', 'መገናኘት ካልቻሉ የታመነ ግዢ አገልግሎትን ይጠቀሙ።', 'Si vous ne pouvez pas vous rencontrer, utilisez le Service d’achat de confiance.'],
          ['Ha furin xiriiriyeyaal ka baxsan Xaraash oo aad shaki ka qabto.', 'Do not open links from outside Xaraash that look suspicious.', 'Usifungue viungo vya nje ya Xaraash vinavyotia shaka.', 'ከXaraash ውጭ የሚመጡ አጠራጣሪ ሊንኮችን አይክፈቱ።', 'N’ouvrez pas les liens suspects venant de l’extérieur de Xaraash.']
        ] },
        { h: ['Ceyrin iyo hanjabaad', 'Harassment and threats', 'Unyanyasaji na vitisho', 'ትንኮሳና ዛቻ', 'Harcèlement et menaces'], p: [['Ceyrin, hanjabaad iyo takoor ma aqbalno. Haddii lagu dhibo, xannib isticmaalaha, soo sheeg xayeysiiska, ama nala soo xiriir.', 'We do not accept harassment, threats or discrimination. If you are targeted, block the user, report the post, or contact us.', 'Hatukubali unyanyasaji, vitisho wala ubaguzi. Ukilengwa, mzuie mtumiaji, ripoti tangazo, au wasiliana nasi.', 'ትንኮሳን፣ ዛቻን ወይም መድልዎን አንቀበልም። ዒላማ ከሆኑ ተጠቃሚውን ያግዱ፣ ማስታወቂያውን ሪፖርት ያድርጉ ወይም ያግኙን።', 'Nous n’acceptons ni harcèlement, ni menaces, ni discrimination. Si vous êtes visé, bloquez l’utilisateur, signalez l’annonce ou contactez-nous.']] },
        { h: ['Ilaalinta caruurta', 'Child protection', 'Ulinzi wa watoto', 'የሕፃናት ጥበቃ', 'Protection de l’enfance'], p: [['Xayeysiis kasta oo waxyeello u geysta caruurta waa laga saaraa. Haddii aad aragto mid, soo sheeg isla markiiba.', 'Any post that harms children is removed. If you see one, report it right away.', 'Tangazo lolote linalowadhuru watoto huondolewa. Ukiliona, liripoti mara moja.', 'ሕፃናትን የሚጎዳ ማንኛውም ማስታወቂያ ይወገዳል። ካዩ ወዲያውኑ ሪፖርት ያድርጉ።', 'Toute annonce qui nuit aux enfants est supprimée. Si vous en voyez une, signalez-la immédiatement.']] },
        { h: ['Dumarka iyo gabdhaha', 'Women and girls', 'Wanawake na wasichana', 'ሴቶችና ልጃገረዶች', 'Femmes et filles'], p: [['Ha u dirin lambarkaaga qof aadan aqoon. Isticmaal farriimaha Xaraash, oo isticmaalaha xannib haddii aad dareento khatar.', 'Do not give your number to someone you do not know. Use Xaraash messages, and block anyone who makes you feel unsafe.', 'Usimpe namba yako mtu usiyemjua. Tumia ujumbe wa Xaraash, na mzuie yeyote anayekufanya ujisikie huna usalama.', 'የማያውቁትን ሰው ስልክ ቁጥርዎን አይስጡ። የXaraash መልዕክቶችን ይጠቀሙ፣ ደህንነት የማይሰማዎት ሰው ካለ ያግዱት።', 'Ne donnez pas votre numéro à quelqu’un que vous ne connaissez pas. Utilisez la messagerie Xaraash et bloquez toute personne qui vous met mal à l’aise.']] },
        { h: ['Ka ganacsiga dadka', 'Human trafficking', 'Biashara ya binadamu', 'የሰዎች ዝውውር', 'Traite des êtres humains'], p: [['Xayeysiis ku saabsan dhoofinta dadka, shaqo been ah ama iibinta xubno jirka ah waa mamnuuc. Haddii aad khatar ku jirto, la xiriir booliiska ama hay’adda gargaarka ee deegaankaaga.', 'Posts about people trafficking, fake job offers or selling body organs are banned. If you are in danger, contact your local police or aid organisation.', 'Matangazo ya biashara ya binadamu, ajira za uongo au kuuza viungo vya mwili ni marufuku. Ukiwa hatarini, wasiliana na polisi au shirika la msaada la eneo lako.', 'ስለ ሰዎች ዝውውር፣ የሐሰት የሥራ ማስታወቂያ ወይም የአካል ክፍሎች ሽያጭ የሚያወሩ ማስታወቂያዎች የተከለከሉ ናቸው። አደጋ ላይ ከሆኑ የአካባቢዎን ፖሊስ ወይም የእርዳታ ድርጅት ያግኙ።', 'Les annonces de traite d’êtres humains, de fausses offres d’emploi ou de vente d’organes sont interdites. Si vous êtes en danger, contactez la police ou une organisation d’aide locale.']] },
        { h: ['Sida loo soo sheego', 'How to report', 'Jinsi ya kuripoti', 'እንዴት ሪፖርት ማድረግ እንደሚቻል', 'Comment signaler'], p: [['Dhagsii “Soo sheeg” boggan xayeysiiska, ama nala soo xiriir. Khatar degdeg ah haddii ay jirto, marka hore la xiriir amniga deegaankaaga.', 'Use “Report” on the post page, or contact us. For immediate danger, contact local emergency services first.', 'Tumia “Ripoti” kwenye ukurasa wa tangazo, au wasiliana nasi. Kwa hatari ya haraka, wasiliana kwanza na huduma za dharura za eneo lako.', 'በማስታወቂያው ገጽ ላይ “ሪፖርት” ይጠቀሙ ወይም ያግኙን። ለአስቸኳይ አደጋ መጀመሪያ የአካባቢዎን የአደጋ ጊዜ አገልግሎት ያግኙ።', 'Utilisez « Signaler » sur la page de l’annonce, ou contactez-nous. En cas de danger immédiat, appelez d’abord les services d’urgence locaux.']] }
      ]

    discount: {
      title: ['Nidaamka Dhimista', 'Discount System', 'Mfumo wa Punguzo', 'የቅናሽ ስርዓት', 'Système de remises'],
      lead: ['Dhimistu waxay hoos u dhigtaa komishanka iibka iyadoo lagu salaynayo sida aad ula shaqeyso Xaraash.', 'The discount lowers your sales commission based on how you work with Xaraash.', 'Punguzo hupunguza kamisheni ya mauzo kulingana na jinsi unavyofanya kazi na Xaraash.', 'ቅናሹ ከXaraash ጋር በሚሰሩበት መንገድ መሰረት የሽያጭ ኮሚሽንዎን ይቀንሳል።', 'La remise réduit votre commission de vente selon votre façon de travailler avec Xaraash.'],
      blocks: [
        { h: ['Waa maxay?', 'What is it?', 'Ni nini?', 'ምንድን ነው?', 'De quoi s’agit-il ?'], p: [['Tusaale: komishanka aasaasiga ah waa 1% iibka. Nidaamku wuxuu u dhimi karaa boqolleyda hoose. Waxay khusaysaa qaybta gawaarida iyo rootooyinka.', 'Example: the base commission is 1% of the sale. The system can lower it to a smaller percentage. It applies to the cars and trucks sector.', 'Mfano: kamisheni ya msingi ni 1% ya mauzo. Mfumo unaweza kuipunguza hadi asilimia ndogo. Inahusu sekta ya magari na malori.', 'ምሳሌ፡ መነሻ ኮሚሽኑ የሽያጩ 1% ነው። ስርዓቱ ወደ ዝቅተኛ መቶኛ ሊቀንሰው ይችላል። ለመኪናና ለጭነት መኪና ዘርፍ ይሰራል።', 'Exemple : la commission de base est de 1 % de la vente. Le système peut la réduire à un pourcentage plus faible. Elle s’applique au secteur des voitures et camions.']] },
        { h: ['Yaa u qalma?', 'Who is it for?', 'Ni kwa nani?', 'ለማን ነው?', 'Pour qui ?'], p: [['Dhammaan dadka xayeysiiya gawaarida: shakhsiyaad, dilaaliin, iyo bandhigyada gawaarida.', 'Everyone who advertises vehicles: individuals, dealers, marketers and car showrooms.', 'Wote wanaotangaza magari: watu binafsi, madalali na vyumba vya maonyesho.', 'ተሽከርካሪዎችን ለሚያስተዋውቁ ሁሉ፡ ግለሰቦች፣ ነጋዴዎች፣ ደላሎችና የመኪና ማሳያ ክፍሎች።', 'Tous ceux qui annoncent des véhicules : particuliers, concessionnaires, intermédiaires et salons automobiles.']] },
        { h: ['Maxaa dhimista go’aamiya?', 'What sets the discount?', 'Ni nini huamua punguzo?', 'ቅናሹን የሚወስነው ምንድን ነው?', 'Qu’est-ce qui détermine la remise ?'], ul: [
          ['Tirada iyo qiimaha iibka.', 'The number and value of sales.', 'Idadi na thamani ya mauzo.', 'የሽያጭ ብዛትና ዋጋ።', 'Le nombre et la valeur des ventes.'],
          ['Bixinta khidmadaha waqtigeeda.', 'Paying fees on time.', 'Kulipa ada kwa wakati.', 'ክፍያዎችን በጊዜ መክፈል።', 'Payer les frais à temps.'],
          ['Cabashooyin la’aan oo iibsadayaal ka yimaada.', 'No complaints from buyers.', 'Kutokuwa na malalamiko kutoka kwa wanunuzi.', 'ከገዢዎች ቅሬታ አለመኖር።', 'Aucune plainte d’acheteurs.'],
          ['Ixtiraamka xayeysiisyada kale.', 'Respecting other people’s posts.', 'Kuheshimu matangazo ya wengine.', 'የሌሎችን ማስታወቂያ ማክበር።', 'Respecter les annonces des autres.'],
          ['In aan iibsadaha laga qaadin khidmad dheeraad ah.', 'Not charging the buyer extra fees.', 'Kutomtoza mnunuzi ada za ziada.', 'ከገዢው ተጨማሪ ክፍያ አለመጠየቅ።', 'Ne pas facturer de frais supplémentaires à l’acheteur.'],

  function postJSON(obj) {

  // Public endpoint URL lives in config.js. Never put the WhatsApp access token here.
  function API() {
    var raw = window.XARAASH_API_URL || (window.XARAASH_CONFIG && window.XARAASH_CONFIG.apiUrl) || '';
    var u = String(raw).trim();
    if (!u || /PASTE_|YOUR_DEPLOYMENT_ID|YOUR_WEB_APP_URL|REPLACE_ME/i.test(u)) return '';
    try {
      var parsed = new URL(u);
      if (parsed.protocol !== 'https:' || parsed.hostname !== 'script.google.com') return '';
      if (!/^\/macros\/s\/[^/]+\/exec\/?$/.test(parsed.pathname)) return '';
      return parsed.href;
    } catch (e) { return ''; }
  }
  async function shareRemote(post) {
    try {
      var r = await fetch(API(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'add', token: post.token || '', acct: post.acct || 'person', title: post.title[0], cat: post.cat, city: post.city, priceUsd: post.price, name: post.user || '', phone: post.phone || '', photos: post.photos || [] }) });
      var d = await r.json();
      if (d && d.error === 'unverified') { try { localStorage.removeItem('xaraash-ver'); } catch (e2) {} toast(R('vNeed')); S.mine = S.mine.filter(function (m) { return m !== post; }); renderList(); return; }
      if (!d || !d.ok) throw new Error('rejected');
      if (d.id && d.editKey) setKey(d.id, d.editKey);
      S.mine = S.mine.filter(function (m) { return m !== post; });
      await loadRemote(); toast(t().shared);
    } catch (e) { toast(t().shareFail); }
  }
  async function loadRemote() {
    var u = API(); if (!u) return;
    try {
      var listUrl = new URL(u);
      listUrl.searchParams.set('action', 'list');
      var r = await fetch(listUrl.toString(), { cache: 'no-store' });
      if (!r.ok) return;
      var d = await r.json();
      if (!d || !Array.isArray(d.posts)) return;
      var now = Date.now();
      S.remote = d.posts.slice(0, 200).map(function (p) {
        var title = String(p.title || '').slice(0, 80); if (!title) return null;
        var price = p.priceUsd === null || p.priceUsd === '' || p.priceUsd === undefined ? null : Number(p.priceUsd);
        return {
          rid: String(p.id).replace(/[^\w-]/g, '').slice(0, 20),
          id: 'r' + String(p.id).replace(/[^\w-]/g, '').slice(0, 20),
          phone: cleanPhone(p.phone),
          cat: CATS.indexOf(p.cat) > 0 ? p.cat : 'services',
          tag: '', city: String(p.city || '').slice(0, 40), price: isFinite(price) ? price : null,
          user: String(p.user || 'Member').slice(0, 40), acct: p.acct === 'company' ? 'company' : 'person', re: 0, mine: !!getKeys()[String(p.id).replace(/[^\w-]/g, '').slice(0, 20)],
          age: Math.max(0, Math.round((now - Number(p.ts)) / 60000)) || 0,
          title: [title, title, title, title, title],
          photos: (Array.isArray(p.photos) ? p.photos : []).filter(function (x) { return /^[\w-]{10,80}$/.test(String(x)); }).slice(0, 5).map(function (x) { return 'https://drive.google.com/thumbnail?id=' + x + '&sz=w1000'; })
        };
      }).filter(Boolean);
      renderList();
    } catch (e) {}
  }
